<head>
<meta charset="UTF-8">

<title>After the Lesson</title>
<!-- Open Graph: como o link aparece ao ser compartilhado (WhatsApp etc.) — troque a URL se o site mudar de endereço -->

<meta property="og:description" content="Seu espaço de aprendizado de inglês">

<meta property="og:type" content="website">
<meta property="og:url" content="https://minhamentoria.vercel.app">
<meta name="twitter:card" content="summary">
<script>
// Aplica o tema salvo (se houver) antes da página desenhar, pra não piscar o tema errado.
// Tema visual infantil: ativado por ?tema=infantil (atributo data-tema, separado do data-theme claro/escuro).
// A fonte Nunito só é carregada quando este tema está ativo. ?modo=claro|escuro escolhe o modo (útil pra testar).
try{
  var _q = new URLSearchParams(location.search);
  var _m = _q.get('modo');
  if(_m === 'claro' || _m === 'escuro') sessionStorage.setItem('aluno-tema', _m === 'claro' ? 'light' : 'dark');
  if(_q.get('tema') === 'infantil'){
    document.documentElement.setAttribute('data-tema', 'infantil');
    var _f = document.createElement('link'); _f.rel = 'stylesheet';
    _f.href = 'https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..900&display=swap';
    document.head.appendChild(_f);
  }
}catch(e){}
try{
  var temaSalvo = sessionStorage.getItem('aluno-tema');
  if(temaSalvo) document.documentElement.setAttribute('data-theme', temaSalvo);
  // Tema infantil abre no modo claro por padrão (a escolha do aluno, se houver, vale sempre).
  else if(document.documentElement.getAttribute('data-tema') === 'infantil') document.documentElement.setAttribute('data-theme', 'light');
}catch(e){}
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23cb4c46'/%3E%3Crect x='20' y='14' width='9' height='36' rx='2' fill='%23fff'/%3E%3Crect x='20' y='14' width='28' height='9' rx='2' fill='%23fff'/%3E%3Crect x='20' y='30' width='22' height='9' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,600..900&display=swap" rel="stylesheet">
<style>
  /* ---- Paleta e tipografia: troque só aqui pra personalizar o visual ----
     Cor: os nomes das variáveis (--amber-bold etc.) ficaram assim por
     história do projeto original, mas são só rótulos — pode colocar
     qualquer cor no valor de cada uma, a estrutura abaixo (uma cor de
     fundo escuro, branco, um tom neutro, uma cor de destaque com 3
     variações mais claras, uma cor de "tinta" mais escura da mesma
     família, vermelho de perigo, e uma cor de borda) é o que o resto
     do CSS espera encontrar.
     Fonte: troque --font-display/--font-label/--font-body pela pilha
     de fontes que quiser (ou por uma fonte do Google Fonts, adicionando
     o <link> correspondente no <head>). */
 :root{
    --charcoal:#2b2422; --white:#ffffff; --muted:#9c8f8b;
    --amber-bold:#cb4c46; --amber-1:#f0d6d1; --amber-2:#f5e3df; --amber-3:#eaeae9;
    --ink-amber:#670010; --danger:#ae1f23; --line:#d7c9c4;
    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-label:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    /* Modo escuro (padrão): fundo geral escuro, cards claros. */
    /* ---- Variáveis extras (etapa "faxina"): valores idênticos aos que estavam soltos no CSS. ---- */
    /* Superfícies e textos que eram #fff / cinzas fixos */
    --superficie:#fff; --logo-texto:#fff; --fundo-video:#000;
    --cinza-texto:#6b7178; --cinza-escuro:#33383e; --cinza-pausa:#8b929a; --cinza-suave:#80868d;
    /* Gabarito (certo/errado). A borda do errado usa --danger. */
    --certo-borda:#3f7d4a; --certo-fundo:#eaf3ec; --errado-fundo:#fbebea;
    /* Azul antigo (sobra da paleta original): só os números R,G,B, usados com transparência em rgba(). */
    --azul-antigo-rgb:91,143,201;
    /* Sombras e tons avermelhados */
    --sombra-card:0 1px 3px rgba(43,36,34,0.08), 0 20px 45px -22px rgba(103,0,16,0.28);
    --progresso-trilha:rgba(240,214,209,0.18);
    /* Logo em SVG */
    --logo-fundo:#670010; --logo-simbolo:#fff;
    /* Cantos arredondados */
    --raio-etiqueta:6px; --raio-campo:8px; --raio-painel:10px; --raio-caixa:12px; --raio-opcao:14px;
    --raio-carta:16px; --raio-card:20px; --raio-pilula:20px; --raio-botao:24px; --raio-logo:40px;
    /* Papéis novos (defaults = comportamento de sempre; o tema infantil troca): */
    --sobre-destaque:var(--charcoal);        /* texto sobre fundos de destaque (botões) */
    --muted-pagina:var(--muted);             /* textos cinza que ficam direto no fundo da página */
    --destaque-pagina:var(--amber-bold);     /* textos coloridos que ficam direto no fundo da página */
    --destaque-pagina-hover:var(--ink-amber);
    --salvando-fundo:var(--charcoal); --salvando-texto:var(--amber-bold); /* aviso "salvando..." */
    --bg-pagina:var(--charcoal);
    --cor-cabecalho:var(--white);
    color-scheme:dark;
  }
  [data-theme="light"]{
    /* Modo claro: inverte o fundo geral, mantendo os cards e as cores terracota/vinho. */
    --bg-pagina:#f7f0ec;
    --cor-cabecalho:var(--charcoal);
    color-scheme:light;
  }
  /* ==========================================================================
     TEMA INFANTIL — paleta "Pôr do sol". Ativa com ?tema=infantil (atributo data-tema="infantil"
     na tag <html>, separado do data-theme claro/escuro). Só troca variáveis; sem o atributo, nada aqui vale.
     Contraste: texto branco sobre o coral (#D2422E) = 4,6:1; ameixa sobre creme = 11,7:1; demais pares conferidos (>= 4,5:1).
     ========================================================================== */
  [data-tema="infantil"]{
    --charcoal:#4A235A; --white:#ffffff; --muted:#7A5A88;
    --amber-bold:#D2422E; --amber-1:#FFE9B3; --amber-2:#FFF3DA; --amber-3:#FFFDF9;
    --ink-amber:#4A235A; --danger:#B3172B; --line:#D9C3E0;
    --font-display:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-label:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    /* Modo escuro (padrão do app): fundo ameixa escuro, títulos cremes, cards claros. */
    --bg-pagina:#2A1436; --cor-cabecalho:#FFF6EA;
    --sobre-destaque:#ffffff; --muted-pagina:#D9C3E5; --destaque-pagina:#FF8F7E; --destaque-pagina-hover:#FFC94D;
    --salvando-fundo:#4A235A; --salvando-texto:#FFC94D;
    --cinza-texto:#6E4F7C; --cinza-escuro:#3A1A48; --cinza-pausa:#75567F; --cinza-suave:#6E4F7C;
    --certo-borda:#2E7D46; --certo-fundo:#E6F4EA; --errado-fundo:#FDE8EA;
    --azul-antigo-rgb:210,66,46;   /* (nome herdado) aqui vira o coral, só como transparência */
    --sombra-card:0 2px 4px rgba(74,35,90,0.08), 0 18px 36px -18px rgba(74,35,90,0.38);
    --progresso-trilha:rgba(255,246,234,0.18);
    --logo-fundo:#4A235A; --logo-simbolo:#FFC94D; --logo-texto:#ffffff;
    /* Cantos bem arredondados */
    --raio-etiqueta:10px; --raio-campo:12px; --raio-painel:16px; --raio-caixa:18px; --raio-opcao:20px;
    --raio-carta:24px; --raio-card:28px; --raio-pilula:999px; --raio-botao:999px; --raio-logo:999px;
  }
  [data-tema="infantil"][data-theme="light"]{
    /* Modo claro: fundo creme, títulos ameixa. */
    --bg-pagina:#FFF6EA; --cor-cabecalho:#4A235A;
    --muted-pagina:#7A5A88; --destaque-pagina:#B93624; --destaque-pagina-hover:#4A235A;
    --progresso-trilha:rgba(74,35,90,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg-pagina);
    background-image:radial-gradient(circle at 15% 8%, rgba(var(--azul-antigo-rgb),0.08), transparent 40%),radial-gradient(circle at 85% 92%, rgba(var(--azul-antigo-rgb),0.06), transparent 45%);
    color:var(--charcoal); font-family:var(--font-body); line-height:1.6; padding:0 0 80px 0;
    transition:background-color .2s ease;
  }
  [data-theme="light"] body{background-image:none;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}
  header{padding:56px 24px 40px 24px; text-align:center; color:var(--cor-cabecalho);}
  .logo{display:inline-flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
  .logo-pill{display:inline-flex; align-items:center; gap:12px; background:var(--amber-bold); padding:12px 26px; border-radius:var(--raio-logo);}
  .logo-mark{width:32px; height:32px; flex:0 0 auto;}
  .logo-nome{font-family:var(--font-display); font-style:italic; font-weight:700; font-size:26px; color:var(--logo-texto); line-height:1;}
  .logo-professor{font-family:var(--font-label); font-weight:600; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted-pagina);}
  h1{font-family:var(--font-display); font-weight:900; font-size:clamp(30px,4.5vw,44px); line-height:1.15; margin:0;}
  .header-data{font-family:var(--font-body); font-weight:400; font-style:italic; font-size:15px; color:var(--muted-pagina); margin-top:12px;}
  .finalizar-area{max-width:900px; margin:32px auto 0 auto; padding:0 24px; text-align:center;}
  .finalizar-btn{font-family:var(--font-label); font-weight:700; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; background:var(--amber-bold); border:none; color:var(--sobre-destaque); padding:14px 28px; border-radius:var(--raio-botao); cursor:pointer;}
  .finalizar-btn:hover{background:var(--amber-2); color:var(--charcoal);}
  .finalizar-hint{font-size:13px; color:var(--muted-pagina); margin-top:12px;}
  .finalizada-msg{font-family:var(--font-label); font-weight:700; font-size:13px; color:var(--destaque-pagina); background:rgba(var(--azul-antigo-rgb),0.12); border:1px solid rgba(var(--azul-antigo-rgb),0.3); border-radius:var(--raio-botao); padding:14px 24px; display:inline-block;}
  .save-indicator{position:fixed; top:14px; right:14px; font-family:var(--font-label); font-weight:700; font-size:11px; letter-spacing:0.05em; background:var(--salvando-fundo); color:var(--salvando-texto); padding:6px 12px; border-radius:var(--raio-pilula); opacity:0; transition:opacity .3s ease; z-index:100; border:1px solid rgba(var(--azul-antigo-rgb),0.3);}
  .save-indicator.show{opacity:1;}
  .tema-toggle{position:fixed; top:14px; left:14px; width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line); background:var(--amber-3); color:var(--ink-amber); cursor:pointer; z-index:100;}
  .tema-toggle:hover{border-color:var(--amber-bold);}
  .tema-toggle svg{width:18px; height:18px;}
  .card{max-width:900px; background:var(--amber-3); border-radius:var(--raio-card); padding:38px 42px; margin:0 auto; box-shadow:var(--sombra-card);}
  /* Blindagem: mesmo sem a div .card, a seção já nasce com o fundo claro. Evita texto invisível se o conteúdo esquecer o wrapper. */
  section.block{max-width:900px; margin:0 auto; background:var(--amber-3); border-radius:var(--raio-card); padding:38px 42px; box-shadow:var(--sombra-card); border-top:4px solid var(--amber-bold); position:relative;}
  section.block .card{box-shadow:none; padding:0; margin:0; border-radius:0;}

  /* respiro entre blocos consecutivos da lição, pra cada um ler como uma ilha separada */
  #conteudo-sessao > section.block,
  #conteudo-sessao > .card,
  #conteudo-sessao > .flashcard-group{margin-bottom:40px;}
  #conteudo-sessao > section.block:last-child,
  #conteudo-sessao > .card:last-child,
  #conteudo-sessao > .flashcard-group:last-child{margin-bottom:0;}

  /* ---- Animações sutis: entrada suave dos blocos ao carregar a página ---- */
  @keyframes entrada-suave{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  #conteudo-sessao > section.block,
  #conteudo-sessao > .card,
  #conteudo-sessao > .flashcard-group{animation-name:entrada-suave; animation-duration:.5s; animation-timing-function:ease; animation-fill-mode:both;}
  #conteudo-sessao > *:nth-child(1){animation-delay:.05s;}
  #conteudo-sessao > *:nth-child(2){animation-delay:.1s;}
  #conteudo-sessao > *:nth-child(3){animation-delay:.15s;}
  #conteudo-sessao > *:nth-child(4){animation-delay:.2s;}
  #conteudo-sessao > *:nth-child(n+5){animation-delay:.25s;}
  @media (prefers-reduced-motion: reduce){
    #conteudo-sessao > section.block,
    #conteudo-sessao > .card,
    #conteudo-sessao > .flashcard-group{animation:none;}
  }

  /* "Focus point": rótulo automático do bloco explicativo (o tipo "padrão", sem marcação especial).
     Suprimido nos tipos com identidade própria — exercícios, reading, link/embed, fechamento da sessão. */
  section.block::before{
    content:'🎯 Focus point'; display:block;
    font-family:var(--font-label); font-weight:700; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-amber); margin-bottom:10px;
  }
  section.block:has(.dnd-exercise)::before,
  section.block:has(.quiz-exercise)::before,
  section.block:has(.flashcard)::before,
  section.block:has(.reading-passage)::before,
  section.block:has(> textarea)::before,
  section.block:has(.embed-video)::before,
  section.block:has(.link-card)::before,
  section.block.session-closing::before{content:none; display:none;}
  .msg{max-width:600px; margin:40px auto; text-align:center; color:var(--cor-cabecalho); font-family:var(--font-display); font-weight:600; font-size:20px;}
  .kicker{font-family:var(--font-label); font-weight:700; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-amber); margin-bottom:10px;}
  h2{font-family:var(--font-display); font-weight:800; font-size:28px; margin:0 0 6px 0; color:var(--charcoal);}
  h3{font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 12px 0;}
  .tagline{font-style:italic; color:var(--cinza-texto); font-size:15px; margin-bottom:28px;}
  p{margin:0 0 16px 0;}
  img{max-width:100%; height:auto; display:block; margin:18px auto; border-radius:var(--raio-campo);}
  .transcript{font-family:var(--font-body); font-size:14px; background:var(--amber-2); border-left:3px solid var(--amber-bold); padding:14px 18px; margin:18px 0; color:var(--cinza-escuro); white-space:pre-wrap; border-radius:0 var(--raio-campo) var(--raio-campo) 0;}
  .transcript .pause{color:var(--cinza-pausa);} .transcript .flag{color:var(--ink-amber); font-weight:700;}
  .prompt-block{background:var(--amber-2); border:1px solid var(--line); border-radius:var(--raio-painel); padding:22px 24px; margin:22px 0;}
  .example-block{background:var(--amber-1); border-left:3px solid var(--amber-bold); padding:12px 16px; margin:14px 0 20px 0; font-size:14.5px; border-radius:0 var(--raio-campo) var(--raio-campo) 0;}
  .example-block .lbl{font-family:var(--font-label); font-weight:700; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-amber); display:block; margin-bottom:4px;}
  .sentence-pair{display:flex; flex-direction:column; gap:6px; margin:14px 0;}
  .sentence-pair .a, .sentence-pair .b, .sentence-pair .wrong, .sentence-pair .right{font-family:var(--font-display); font-weight:700; font-size:17px; padding:2px 0;} .sentence-pair .b, .sentence-pair .right{color:var(--ink-amber);}
  textarea{width:100%; font-family:var(--font-body); font-size:14.5px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--raio-campo); background:var(--superficie); resize:vertical; min-height:44px; color:var(--charcoal);}
  textarea:focus{outline:none; border-color:var(--amber-bold);}
  .qtext{font-weight:700; font-size:15px; margin-bottom:8px;}
  .whiteboard-tag{display:inline-block; font-family:var(--font-label); font-weight:700; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; background:var(--charcoal); color:var(--amber-1); padding:3px 9px; border-radius:var(--raio-etiqueta); margin-bottom:14px;}

  /* ---- Texto livre: caixa de texto avulsa (bloco só com textarea) ganha toque de "caderno".
     :not(.session-closing) porque a pergunta de fechamento também tem textarea direta, mas
     usa seu próprio visual (ver "Pergunta de fechamento" mais abaixo). ---- */
  section.block:has(> textarea):not(.session-closing) .qtext::before{content:'✎ '; color:var(--ink-amber);}
  section.block:has(> textarea):not(.session-closing) textarea{border:1.5px dashed var(--line); background:var(--amber-3);}
  section.block:has(> textarea):not(.session-closing) textarea:focus{border-style:solid;}
  table.map-table, .map-table table{width:100%; border-collapse:collapse; margin:18px 0; font-size:14.5px;}
  table.map-table th, table.map-table td, .map-table th, .map-table td{border:1px solid var(--line); padding:10px 12px; text-align:left;}
  table.map-table th, .map-table th{background:var(--amber-2); font-family:var(--font-label); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em;}
  .word-list{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0;}
  .word-chip{font-family:var(--font-display); font-weight:700; font-size:16px; background:var(--superficie); border:1px solid var(--line); border-radius:var(--raio-pilula); padding:6px 16px;} .word-chip strong{color:var(--ink-amber);}
  .drill-lines{font-family:var(--font-display); font-weight:600; font-size:18px; line-height:2; margin:18px 0;} .drill-lines strong{color:var(--ink-amber);}
  .reveal-btn{font-family:var(--font-label); font-weight:700; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; background:none; border:1px solid var(--amber-bold); color:var(--ink-amber); padding:8px 16px; border-radius:var(--raio-pilula); cursor:pointer; margin-top:8px;}
  .reveal-btn:hover{background:var(--amber-bold); color:var(--sobre-destaque);}
  .reveal-content{display:none; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); font-size:14.5px;}
  .reveal-content.open{display:block;} .reveal-content p{margin:0 0 10px 0;}

  /* ---- Exercícios: arrastar e soltar (match up / complete the sentence / unjumble / sorting) ---- */
  section.block:has(.dnd-exercise){border-top-style:dashed;}
  .dnd-exercise{margin:22px 0;}
  .dnd-hint{font-style:italic; color:var(--cinza-texto); font-size:13px; margin:2px 0 10px 0;}
  .dnd-bank{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 20px 0; padding:16px; background:var(--amber-2); border:2px dashed var(--line); border-radius:var(--raio-caixa); min-height:20px; box-shadow:inset 0 2px 8px rgba(0,0,0,0.07);}
  .dnd-piece{font-family:var(--font-display); font-weight:700; font-size:16px; background:var(--superficie); border:1px solid var(--line); border-radius:var(--raio-pilula); padding:6px 16px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; box-shadow:0 3px 8px -4px rgba(0,0,0,0.3);}
  .dnd-piece:active{cursor:grabbing;}
  .dnd-piece.dragging{box-shadow:0 12px 30px -10px rgba(0,0,0,0.45); z-index:200;}
  @keyframes encaixe-pulso{ 0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1);} }
  .dnd-piece.encaixou{animation:encaixe-pulso .3s ease;}
  @media (prefers-reduced-motion: reduce){ .dnd-piece.encaixou{animation:none;} }
  .dnd-piece-placeholder{display:inline-block; visibility:hidden;}
  .dnd-target{display:inline-flex; align-items:center; justify-content:center; min-width:90px; min-height:34px; padding:4px 12px; margin:0 2px; border:2px dashed var(--line); border-radius:var(--raio-pilula); background:var(--amber-2); vertical-align:middle;}
  .dnd-target.filled{border-style:solid; border-color:var(--amber-bold); background:var(--superficie); padding:2px 4px;}
  .dnd-target.drag-over{border-color:var(--ink-amber); background:var(--amber-1);}
  .dnd-row{display:flex; align-items:center; gap:12px; margin:8px 0;}
  .dnd-label{font-family:var(--font-display); font-weight:700; font-size:16px; min-width:110px;}
  .formato-unjumble .dnd-row{flex-wrap:wrap;}

  /* ---- Sorting: variação do drag-and-drop, colunas (aceitam várias peças) em vez de alvo único ---- */
  .dnd-columns{display:flex; gap:16px; flex-wrap:wrap; margin-top:4px;}
  .dnd-column{flex:1 1 160px; min-height:130px; background:var(--amber-2); border:2px dashed var(--line); border-radius:var(--raio-caixa); padding:14px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; box-shadow:inset 0 2px 8px rgba(0,0,0,0.07);}
  .dnd-column.drag-over{border-color:var(--ink-amber); background:var(--amber-1);}
  .dnd-column-label{font-family:var(--font-label); font-weight:700; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-amber); margin-bottom:2px;}

  /* ---- Exercício: quiz (clique/seleção, sem drag) ---- */
  section.block:has(.quiz-exercise){border-top-color:var(--charcoal);}
  .quiz-exercise{margin:22px 0; display:flex; flex-direction:column; gap:12px;}
  .quiz-option{display:flex; align-items:center; gap:12px; font-family:var(--font-body); font-weight:600; font-size:15px; background:var(--amber-3); border:2px solid var(--line); border-radius:var(--raio-opcao); padding:14px 20px; margin:0; cursor:pointer; transition:border-color .15s ease, background .15s ease;}
  .quiz-option::before{content:''; flex:0 0 auto; width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:var(--superficie);}
  .quiz-option:hover{border-color:var(--amber-bold);}
  .quiz-option.selected{border-color:var(--charcoal); background:var(--amber-1); font-weight:700;}
  .quiz-option.selected::before{border-color:var(--charcoal); background:var(--charcoal); box-shadow:inset 0 0 0 3px var(--amber-1);}

  /* ---- Gabarito automático: botão "Check answers" (mesmo visual do .reveal-btn, classe
     separada pra não entrar no seletor que liga o flip do flashcard) + marcação certo/errado
     + link pequeno "see correct answer" nos itens errados. ---- */
  .gabarito-btn{font-family:var(--font-label); font-weight:700; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; background:none; border:1px solid var(--amber-bold); color:var(--ink-amber); padding:8px 16px; border-radius:var(--raio-pilula); cursor:pointer; margin-top:14px; display:block;}
  .gabarito-btn:hover{background:var(--amber-bold); color:var(--sobre-destaque);}
  .dnd-target.gabarito-certo, .dnd-piece.gabarito-certo, .quiz-option.gabarito-certo{border-color:var(--certo-borda) !important; background:var(--certo-fundo) !important;}
  .dnd-target.gabarito-errado, .dnd-piece.gabarito-errado, .quiz-option.gabarito-errado{border-color:var(--danger) !important; background:var(--errado-fundo) !important;}
  .gabarito-wrap{display:inline-block; margin:2px 6px;}
  .gabarito-link{font-family:var(--font-label); font-size:11.5px; font-weight:600; color:var(--ink-amber); text-decoration:underline; text-underline-offset:2px; cursor:pointer; background:none; border:none; padding:0;}
  .gabarito-link:hover{color:var(--amber-bold);}
  .gabarito-revelado{display:block; margin-top:2px; font-size:12.5px; font-style:italic; color:var(--ink-amber);}

  /* ---- Exercício: flashcard (casca visual sobre reveal-btn/reveal-content já existente) ---- */
  section.block:has(.flashcard){background:transparent; box-shadow:none; border-top:none; padding:0;}
  .flashcard{background:var(--superficie); border:1px solid var(--line); border-radius:var(--raio-carta); padding:32px 28px; margin:18px auto; text-align:center; max-width:400px; position:relative; box-shadow:0 18px 34px -18px rgba(0,0,0,0.45);}
  .flashcard::before, .flashcard::after{content:''; position:absolute; inset:0; border-radius:var(--raio-carta); background:var(--superficie); border:1px solid var(--line); z-index:-1;}
  .flashcard::before{transform:rotate(-3deg) translateY(3px);}
  .flashcard::after{transform:rotate(2.5deg) translateY(5px); opacity:.75;}
  .flashcard-front{font-family:var(--font-display); font-weight:800; font-size:24px; color:var(--charcoal);}
  .flashcard .reveal-btn{margin-top:16px;}
  .flashcard .reveal-content.flashcard-back{border-top:1px dashed var(--line); font-family:var(--font-body); font-weight:600; font-size:15.5px; line-height:1.5; color:var(--ink-amber); text-align:left;}

  /* ---- Baralho de flashcards: cards consecutivos viram um baralho navegável (Prev/Next),
     e ganham a pergunta de reflexão padrão logo abaixo, na mesma "capa" ---- */
  .flashcard-group{max-width:900px; margin:0 auto; background:var(--amber-2); border-radius:var(--raio-card); padding:30px 26px 26px 26px; box-shadow:0 20px 50px -28px rgba(0,0,0,0.5);}
  .flashcard-group .flashcard-deck{margin-bottom:0;}
  .flashcard-group .flash-reflect{background:transparent; box-shadow:none; border:none; border-radius:0; border-top:1px dashed var(--line); padding:22px 4px 0 4px; margin-top:22px;}
  .flashcard-deck{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .deck-stage{display:flex; align-items:center; justify-content:center; gap:20px; width:100%;}
  .deck-hidden{display:none !important;}
  @keyframes carta-entra{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
  .deck-stage > section.block:not(.deck-hidden),
  .deck-stage > .card:not(.deck-hidden){animation:carta-entra .25s ease;}
  @media (prefers-reduced-motion: reduce){
    .deck-stage > section.block:not(.deck-hidden),
    .deck-stage > .card:not(.deck-hidden){animation:none;}
  }
  .deck-nav-btn{flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--superficie); color:var(--ink-amber); font-size:17px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 20px -12px rgba(0,0,0,0.45); transition:border-color .15s ease, background .15s ease, color .15s ease;}
  .deck-nav-btn:hover:not(:disabled){border-color:var(--amber-bold);}
  .deck-nav-btn:disabled{opacity:.3; cursor:default; box-shadow:none;}
  .deck-nav-btn.restart{background:var(--amber-bold); border-color:var(--amber-bold); color:var(--sobre-destaque);}
  .deck-counter{font-family:var(--font-label); font-weight:700; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);}

  /* ---- Reading: passagem curta pro professor colar ---- */
  section.block:has(.reading-passage){border-top:none; border-left:6px solid var(--amber-bold);}
  .reading-passage{max-width:620px; margin:0 auto; line-height:1.8; font-size:16px;}
  .reading-passage p{margin:0 0 18px 0;}
  .reading-passage p:last-child{margin-bottom:0;}

  /* ---- Link/embed: vídeo (iframe que o professor cola) ou artigo externo (card, abre em nova aba) ---- */
  .embed-video{position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--raio-caixa); overflow:hidden; background:var(--fundo-video); margin:6px 0 0 0;}
  .embed-video iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .link-card{display:flex; flex-direction:column; gap:4px; background:var(--superficie); border:1px solid var(--line); border-radius:var(--raio-caixa); padding:16px 20px; text-decoration:none; color:var(--charcoal); margin-top:6px; box-shadow:0 3px 8px -4px rgba(0,0,0,0.15); transition:border-color .15s ease, box-shadow .15s ease;}
  .link-card:hover{border-color:var(--amber-bold); box-shadow:0 10px 20px -12px rgba(0,0,0,0.3);}
  .link-card-label{font-family:var(--font-label); font-weight:700; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-amber);}
  .link-card-title{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .link-card-url{font-size:12.5px; color:var(--muted);}

  /* ---- Pergunta de fechamento: sempre a última coisa da sessão, automática, antes do botão de concluir ---- */
  section.block.session-closing{background:var(--amber-1); border:2px solid var(--amber-bold);}
  section.block.session-closing .kicker{color:var(--charcoal);}
  section.block.session-closing .qtext{font-family:var(--font-display); font-size:19px; font-weight:800; margin-bottom:14px;}

  .progresso{max-width:320px; margin:0 auto 20px auto; padding:0 24px;}
  .progresso-texto{font-family:var(--font-label); font-weight:700; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--destaque-pagina); text-align:center; margin-bottom:8px;}
  .progresso-barra{background:var(--progresso-trilha); border-radius:var(--raio-pilula); height:8px; overflow:hidden;}
  .progresso-preenchido{background:var(--amber-bold); height:100%; border-radius:var(--raio-pilula); transition:width .4s ease;}
  .lembrete-pendentes{max-width:900px; margin:0 auto 16px auto; padding:0 24px; text-align:center; font-family:var(--font-body); font-size:13.5px; font-style:italic; color:var(--muted-pagina);}
  .lembrete-pendentes button{background:none; border:none; padding:0; margin-left:4px; font:inherit; font-style:normal; font-weight:600; color:var(--destaque-pagina); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .lembrete-pendentes button:hover{color:var(--destaque-pagina-hover);}
  .boas-vindas{max-width:900px; margin:0 auto 28px auto; padding:0 24px;}
  .boas-vindas-card{background:var(--amber-1); border:1px solid var(--amber-bold); border-radius:var(--raio-carta); padding:20px 26px; text-align:center; font-family:var(--font-display); font-style:italic; font-weight:600; font-size:17px; color:var(--ink-amber); box-shadow:var(--sombra-card);}
  .acervo{max-width:900px; margin:0 auto 8px auto; padding:0 24px;}
  .acervo-toggle{font-family:var(--font-label); font-weight:700; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--destaque-pagina); background:none; border:1px solid rgba(var(--azul-antigo-rgb),0.35); border-radius:var(--raio-pilula); padding:7px 16px; cursor:pointer;}
  .acervo-toggle:hover{border-color:var(--amber-bold);}
  .acervo-lista{display:none; margin-top:12px; background:var(--amber-3); border-radius:var(--raio-painel); padding:10px 14px;}
  .acervo-lista.open{display:block;}
  .acervo-item{display:block; padding:8px 6px; font-size:14px; color:var(--charcoal); text-decoration:none; border-bottom:1px solid var(--line); cursor:pointer;}
  .acervo-item:last-child{border-bottom:none;}
  .acervo-item:hover{color:var(--ink-amber);}
  .acervo-item.atual{color:var(--ink-amber); font-weight:700;}
  .acervo-item .quando{font-family:var(--font-label); font-weight:600; font-size:11px; color:var(--cinza-suave); margin-left:6px;}
  @media(max-width:640px){ .deck-stage{flex-direction:column;} }
  @media(max-width:600px){ .card{padding:26px 22px;} section.block{padding:26px 22px;} section.block:has(.flashcard){padding:0;} header{padding:44px 18px 32px 18px;} }

  /* ==========================================================================
     TEMA INFANTIL — personalidade (só vale com data-tema="infantil" na tag <html>).
     Fica no fim do <style> de propósito: assim ganha das regras padrão de mesma força.
     ========================================================================== */
  [data-tema="infantil"]{ --tag-x:42px; --manteiga:#FFC94D; --botao-sombra:#8E2718; --anel:var(--amber-3); }
  @media(max-width:600px){ [data-tema="infantil"]{ --tag-x:22px; } }

  /* ---- Cada card ganha uma faixa grossa colorida no topo + uma etiqueta (emoji grande + nome do tipo).
     A cor e o texto da etiqueta vêm de variáveis definidas por tipo de bloco, mais abaixo. ---- */
  [data-tema="infantil"] section.block{
    --tipo-cor:var(--amber-bold); --tipo-texto:var(--sobre-destaque); --tipo-emoji:'🎯'; --tipo-nome:'Focus point';
    border-top:8px solid var(--tipo-cor); padding-top:82px;
  }
  [data-tema="infantil"] section.block::before,
  [data-tema="infantil"] .flashcard-group::before{
    content:var(--tipo-emoji); position:absolute; top:22px; left:var(--tag-x); z-index:1;
    display:flex; align-items:center; justify-content:center; width:48px; height:48px; margin:0; border-radius:50%;
    background:var(--superficie); border:4px solid var(--tipo-cor); box-shadow:0 0 0 4px var(--anel);
    font-size:25px; line-height:1; letter-spacing:0; text-transform:none;
  }
  [data-tema="infantil"] section.block::after,
  [data-tema="infantil"] .flashcard-group::after{
    content:var(--tipo-nome); position:absolute; top:31px; left:calc(var(--tag-x) + 32px);
    display:flex; align-items:center; height:30px; padding:0 18px 0 32px; border-radius:999px;
    background:var(--tipo-cor); color:var(--tipo-texto);
    font-family:var(--font-label); font-weight:800; font-size:14px; letter-spacing:0.01em; text-transform:none;
  }

  /* Tipos de bloco: cada um com sua cor da paleta (coral, ameixa, manteiga), emoji e nome. */
  [data-tema="infantil"] section.block:has(.dnd-exercise){ --tipo-cor:var(--charcoal); --tipo-texto:var(--superficie); --tipo-emoji:'🧩'; --tipo-nome:'Drag & drop'; }
  [data-tema="infantil"] section.block:has(.quiz-exercise){ --tipo-cor:var(--manteiga); --tipo-texto:var(--charcoal); --tipo-emoji:'⭐'; --tipo-nome:'Quiz'; }
  [data-tema="infantil"] section.block:has(.reading-passage){ --tipo-cor:var(--charcoal); --tipo-texto:var(--superficie); --tipo-emoji:'📖'; --tipo-nome:'Reading'; border-left:0; }
  [data-tema="infantil"] section.block:has(> textarea){ --tipo-emoji:'✏️'; --tipo-nome:'Your turn'; }
  [data-tema="infantil"] section.block:has(.embed-video){ --tipo-emoji:'🎬'; --tipo-nome:'Watch'; }
  [data-tema="infantil"] section.block:has(.link-card){ --tipo-cor:var(--manteiga); --tipo-texto:var(--charcoal); --tipo-emoji:'🔗'; --tipo-nome:'Explore'; }
  [data-tema="infantil"] section.block:has(> textarea):not(.session-closing) .qtext::before{ content:none; }
  /* Baralho de flashcards: a etiqueta fica no grupo (os cards soltos dentro dele não têm etiqueta). */
  [data-tema="infantil"] .flashcard-group{
    --tipo-cor:var(--manteiga); --tipo-texto:var(--charcoal); --tipo-emoji:'🧠'; --tipo-nome:'Flashcards'; --anel:var(--amber-2); --tag-x:26px;
    position:relative; border-top:8px solid var(--tipo-cor); padding-top:82px;
  }
  [data-tema="infantil"] section.block:has(.flashcard){ border-top:0; padding-top:0; }
  [data-tema="infantil"] section.block:has(.flashcard)::before,
  [data-tema="infantil"] section.block:has(.flashcard)::after{ content:none; display:none; }
  [data-tema="infantil"] .flashcard-group section.flash-reflect{ border-top:1px dashed var(--line); padding:22px 4px 0 4px; }
  [data-tema="infantil"] .flashcard-group section.flash-reflect::before,
  [data-tema="infantil"] .flashcard-group section.flash-reflect::after{ content:none; display:none; }
  /* Pergunta de fechamento: já tem o próprio título ("Before you go"), então sem etiqueta. */
  [data-tema="infantil"] section.block.session-closing{ --tipo-cor:var(--charcoal); padding-top:36px; }
  [data-tema="infantil"] section.block.session-closing::before,
  [data-tema="infantil"] section.block.session-closing::after{ content:none; display:none; }

  /* ---- Emojis dos títulos maiores (o JS envolve cada emoji num <span class="emoji-grande">) ---- */
  [data-tema="infantil"] .emoji-grande{ display:inline-block; font-size:1.45em; line-height:1; vertical-align:-0.1em; margin-right:0.12em; }

  /* ---- Textos mais leves: rótulos pequenos deixam a caixa alta e ficam um pouco maiores ---- */
  [data-tema="infantil"] .kicker{ font-size:16px; letter-spacing:0.01em; text-transform:none; }
  [data-tema="infantil"] .example-block .lbl,
  [data-tema="infantil"] .whiteboard-tag,
  [data-tema="infantil"] .dnd-column-label,
  [data-tema="infantil"] .deck-counter,
  [data-tema="infantil"] .link-card-label,
  [data-tema="infantil"] .logo-professor,
  [data-tema="infantil"] .save-indicator{ font-size:13px; letter-spacing:0.02em; text-transform:none; }
  [data-tema="infantil"] table.map-table th, [data-tema="infantil"] .map-table th{ font-size:13px; letter-spacing:0.01em; text-transform:none; }
  [data-tema="infantil"] .progresso-texto{ font-size:14px; letter-spacing:0.01em; text-transform:none; }
  [data-tema="infantil"] .gabarito-link{ font-size:13px; }

  /* ---- Botões "gordinhos": mais altos, com respiro, sombra embaixo que "afunda" ao clicar (bons pro dedo no celular) ---- */
  [data-tema="infantil"] .finalizar-btn,
  [data-tema="infantil"] .reveal-btn,
  [data-tema="infantil"] .gabarito-btn,
  [data-tema="infantil"] .acervo-toggle{
    min-height:48px; padding:12px 26px; font-size:15px; font-weight:800; letter-spacing:0.01em; text-transform:none;
    transition:transform .08s ease, box-shadow .08s ease, background .15s ease, color .15s ease;
  }
  [data-tema="infantil"] .finalizar-btn{ min-height:58px; padding:16px 36px; font-size:16px; box-shadow:0 5px 0 var(--botao-sombra); }
  [data-tema="infantil"] .finalizar-btn:active{ transform:translateY(5px); box-shadow:0 0 0 var(--botao-sombra); }
  [data-tema="infantil"] .reveal-btn,
  [data-tema="infantil"] .gabarito-btn{ background:var(--superficie); border:2px solid var(--amber-bold); box-shadow:0 4px 0 var(--amber-bold); }
  [data-tema="infantil"] .reveal-btn:hover,
  [data-tema="infantil"] .gabarito-btn:hover{ background:var(--amber-bold); color:var(--sobre-destaque); }
  [data-tema="infantil"] .reveal-btn:active,
  [data-tema="infantil"] .gabarito-btn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--amber-bold); }
  [data-tema="infantil"] .acervo-toggle{ border:2px solid var(--destaque-pagina); box-shadow:0 4px 0 var(--destaque-pagina); }
  [data-tema="infantil"] .acervo-toggle:active{ transform:translateY(4px); box-shadow:0 0 0 var(--destaque-pagina); }
  [data-tema="infantil"] .deck-nav-btn{ width:50px; height:50px; font-size:20px; box-shadow:0 4px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease, border-color .15s ease; }
  [data-tema="infantil"] .deck-nav-btn:active:not(:disabled){ transform:translateY(4px); box-shadow:0 0 0 var(--line); }
  [data-tema="infantil"] .deck-nav-btn:disabled{ box-shadow:none; }
  [data-tema="infantil"] .deck-nav-btn.restart{ box-shadow:0 4px 0 var(--botao-sombra); }
  [data-tema="infantil"] .deck-nav-btn.restart:active{ box-shadow:0 0 0 var(--botao-sombra); }
  [data-tema="infantil"] .tema-toggle{ width:46px; height:46px; box-shadow:0 4px 0 var(--line); transition:transform .08s ease, box-shadow .08s ease; }
  [data-tema="infantil"] .tema-toggle svg{ width:22px; height:22px; }
  [data-tema="infantil"] .tema-toggle:active{ transform:translateY(4px); box-shadow:0 0 0 var(--line); }
  /* ---- Celebração ao conferir respostas (parte 2) ---- */
  [data-tema="infantil"] .celebra-msg{
    display:block; width:fit-content; max-width:100%; margin:14px 0 0 0; padding:10px 20px; border-radius:999px;
    font-family:var(--font-label); font-weight:800; font-size:16px; line-height:1.3;
    animation:celebra-msg-vida 4.5s ease both;
  }
  [data-tema="infantil"] .celebra-acerto{ background:var(--manteiga); color:var(--charcoal); }
  [data-tema="infantil"] .celebra-quase{ background:var(--amber-2); color:var(--charcoal); border:2px solid var(--line); }
  @keyframes celebra-msg-vida{ 0%{opacity:0; transform:translateY(6px) scale(.96);} 8%{opacity:1; transform:none;} 88%{opacity:1;} 100%{opacity:0;} }
  .celebra-camada{ position:fixed; width:0; height:0; z-index:300; pointer-events:none; }
  .celebra-peca{ position:absolute; left:0; top:0; width:var(--tam); height:var(--tam); margin:calc(var(--tam) / -2) 0 0 calc(var(--tam) / -2); background:var(--cor); opacity:0; pointer-events:none; animation:celebra-voa var(--dur) var(--atraso) cubic-bezier(.2,.7,.3,1) both; }
  .celebra-estrela{ clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
  .celebra-tira{ width:calc(var(--tam) * .7); height:var(--tam); border-radius:2px; }
  @keyframes celebra-voa{
    0%{ opacity:0; transform:translate(0,0) rotate(0) scale(.3); }
    12%{ opacity:1; }
    65%{ opacity:1; transform:translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); }
    100%{ opacity:0; transform:translate(calc(var(--dx) * 1.15), calc(var(--dy) + 60px)) rotate(calc(var(--rot) * 1.3)) scale(.8); }
  }
  @media (prefers-reduced-motion: reduce){ [data-tema="infantil"] .celebra-msg{ animation:none; } .celebra-camada{ display:none; } }
  @media (prefers-reduced-motion: reduce){
    [data-tema="infantil"] .finalizar-btn, [data-tema="infantil"] .reveal-btn, [data-tema="infantil"] .gabarito-btn,
    [data-tema="infantil"] .acervo-toggle, [data-tema="infantil"] .deck-nav-btn, [data-tema="infantil"] .tema-toggle{ transition:none; }
  }
</style>
</head>
<body>

<div class="save-indicator" id="save-indicator">salvando...</div>
<button class="tema-toggle" id="tema-toggle" onclick="alternarTema()" aria-label="Alternar modo claro ou escuro" title="Alternar modo claro ou escuro">
  <svg id="icone-tema" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>

<div id="app">

<script>
/* ==========================================================================

// Nome do app e seu nome de professor(a) — troque aqui pra personalizar a logo do topo.

const TEXTOS = {

// ---- Modo claro/escuro: lembrado só durante esta sessão do navegador (sessionStorage), não entre visitas diferentes. ----
const TEMA_STORAGE_KEY = 'aluno-tema';
const ICONE_SOL = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';

const params = new URLSearchParams(location.search);
const codigo = params.get('codigo');
const sessaoParam = params.get('sessao');
let sessaoId = null;

async function iniciar(){
  if(!codigo){
    document.getElementById('app').innerHTML = `<div class="msg">${TEXTOS.linkInvalido}</div>`;
    return;
  }
  let url = '/api/sessao?codigo=' + encodeURIComponent(codigo);
  if(sessaoParam) url += '&sessao=' + encodeURIComponent(sessaoParam);
  const r = await fetch(url);
  if(r.status === 404){
    const d = await r.json();
    if(d.erro === 'sessao'){
      document.getElementById('app').innerHTML = `<div class="msg">${TEXTOS.semMaterial(d.nome)}</div>`;
    } else {
      document.getElementById('app').innerHTML = `<div class="msg">${TEXTOS.linkInvalido}</div>`;
    }
    return;
  }
  const d = await r.json();
  sessaoId = d.sessao.id;
  render(d);
}

function render(d){
  const app = document.getElementById('app');
  let alunoDesdeHtml = '';
  if(d.data_inicio){
    const partesDesde = d.data_inicio.split('-');
    if(partesDesde.length === 3){
      const dtDesde = new Date(Number(partesDesde[0]), Number(partesDesde[1]) - 1, Number(partesDesde[2]));
      alunoDesdeHtml = `<div class="header-data">${TEXTOS.alunoDesde(dtDesde.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }))}</div>`;
    }
  }
  app.innerHTML = `
    <header>
      <div class="logo">
        <div class="logo-pill">
          <svg class="logo-mark" viewBox="0 0 64 64" role="img" aria-label="Logo">
            <rect width="64" height="64" rx="16" style="fill:var(--logo-fundo)"/>
            <rect x="20" y="14" width="9" height="36" rx="2" style="fill:var(--logo-simbolo)"/>
            <rect x="20" y="14" width="28" height="9" rx="2" style="fill:var(--logo-simbolo)"/>
            <rect x="20" y="30" width="22" height="9" rx="2" style="fill:var(--logo-simbolo)"/>
          </svg>
          <div class="logo-nome">${NOME_APP}</div>
        </div>
        <div class="logo-professor">${NOME_PROFESSOR}</div>
      </div>
      <h1>${d.sessao.titulo}</h1>
      ${alunoDesdeHtml}
    </header>
    <div class="progresso" id="progresso"></div>
    <div class="lembrete-pendentes" id="lembrete-pendentes"></div>
    <div class="acervo" id="acervo"></div>
    <div class="boas-vindas" id="boas-vindas"></div>
    <div id="conteudo-sessao">${d.sessao.conteudo_html}</div>
    <div class="finalizar-area" id="finalizar-area"></div>
  `;
  // <script> colado dentro do conteudo_html não executa sozinho quando inserido via
  // innerHTML (o navegador bloqueia isso por padrão) — recria cada um pra rodar de verdade.
  const container = document.getElementById('conteudo-sessao');
  if (container) {
    container.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      [...oldScript.attributes].forEach(attr => newScript.setAttribute(attr.name, attr.value));
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }
  document.querySelectorAll('textarea[id^="ta-"]').forEach(ta=>{
    if(d.respostas[ta.id] !== undefined){ ta.value = d.respostas[ta.id]; }
    ta.addEventListener('input', ()=>agendarSalvar(ta.id, ta.value));
  });
  document.querySelectorAll('.reveal-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const alvo = document.getElementById(btn.dataset.target);
      if(alvo) alvo.classList.toggle('open');
    });
  });
  initDragDrop(d);
  initQuiz(d);
  initGabarito();
  initFlashcards(d);
  adicionarPerguntaFechamento(d);
  carregarAcervo(d.sessao.id);
  renderFinalizar(d.sessao.finalizada_em);
  mostrarBoasVindas(d.nome);
  emojisGrandes();
}

// Só no tema infantil: envolve os emojis dos títulos num <span> pra poderem ficar maiores (o texto não muda).
function emojisGrandes(){
  if(!INFANTIL) return;
  const re = new RegExp('(\\p{Extended_Pictographic}(?:\\uFE0F|\\u200D\\p{Extended_Pictographic}|\\p{Emoji_Modifier})*)', 'gu');
  document.querySelectorAll('header h1, #conteudo-sessao h2, #conteudo-sessao h3, .kicker, .boas-vindas-card').forEach(el=>{
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nos = [];
    while(walker.nextNode()) nos.push(walker.currentNode);
    nos.forEach(no=>{
      if(no.parentElement && no.parentElement.closest('.emoji-grande')) return;
      const partes = no.nodeValue.split(re);
      if(partes.length < 2) return;
      const frag = document.createDocumentFragment();
      partes.forEach((p, i)=>{
        if(i % 2 === 1){ const s = document.createElement('span'); s.className = 'emoji-grande'; s.textContent = p; frag.appendChild(s); }
        else if(p){ frag.appendChild(document.createTextNode(p)); }
      });
      no.parentNode.replaceChild(frag, no);
    });
  });
}

async function carregarAcervo(sessaoAtualId){
  try{
    const r = await fetch('/api/sessoes-aluno?codigo=' + encodeURIComponent(codigo));
    const d = await r.json();
    if(!d.sessoes) return;

    renderProgresso(d.sessoes);

    if(d.sessoes.length <= 1) return;
    const acervo = document.getElementById('acervo');
    const itens = d.sessoes.map(s => {
      const atual = s.id === sessaoAtualId ? ' atual' : '';
      const data = new Date(s.criada_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
      return `<span class="acervo-item${atual}" onclick="abrirSessao(${s.id})">${s.titulo}<span class="quando">${data}</span></span>`;
    }).join('');
    acervo.innerHTML = `
      <button class="acervo-toggle" onclick="document.getElementById('acervo-lista').classList.toggle('open')">${TEXTOS.acervoToggle(d.sessoes.length)}</button>
      <div class="acervo-lista" id="acervo-lista">${itens}</div>
    `;
  }catch(e){ }
}

// Lembrete gentil de sessões antigas ainda não finalizadas (não conta a sessão atual, o aluno já está nela).
function renderLembretePendentes(sessoes, sessaoAtualId){

  if(!el) return;
  const pendentes = sessoes.filter(s => !s.finalizada_em && s.id !== sessaoAtualId);
  if(pendentes.length === 0){ el.innerHTML = ''; return; }

let timers = {};
const indicator = document.getElementById('save-indicator');

function agendarSalvar(campoId, valor){
  clearTimeout(timers[campoId]);
  indicator.innerText = TEXTOS.salvando;
  indicator.classList.add('show');
  timers[campoId] = setTimeout(async ()=>{

      indicator.innerText = TEXTOS.salvo;
      setTimeout(()=>indicator.classList.remove('show'), 1500);
    }catch(e){
      indicator.innerText = TEXTOS.erroSalvar;

  }, 700);
}

/* ---- Exercícios: arrastar e soltar (match up / complete the sentence / unjumble / sorting) ----
   Motor único: peça (.dnd-piece, data-piece-id) solta num alvo, dentro de um container
   [id^="dnd-"] (esse id é o campo_id salvo). Sem correção automática: só guarda onde cada
   peça foi colocada. Dois formatos de alvo, tratados por caminhos de código separados pra não
   arriscar quebrar um formato mexendo no outro:
   - alvo único (.dnd-target, data-target-id): usado por fill/unjumble/matchup. Uma peça por
     alvo. Estado salvo como JSON {targetId: pieceId}.
   - coluna (.dnd-column, data-column-id): usado por sorting. Aceita várias peças. Estado
     salvo como JSON {pieceId: columnId}. */

let dragState = null;

// ---- Auto-scroll durante o arrasto: quando o dedo/cursor chega perto do topo ou do
// rodapé da tela, rola a página sozinha na direção correspondente, pra dar pra soltar a
// peça num alvo que está fora da área visível. Funciona com toque e mouse porque só chama
// window.scrollBy() por conta própria — não depende de gesto nativo de rolagem (que o
// touch-action:none da peça bloqueia de propósito, pra não brigar com o arrasto). ----
const AUTOSCROLL_BORDA = 70;
const AUTOSCROLL_VELOCIDADE_MAX = 14;

let autoScrollDirecao = 0;
let autoScrollVelocidade = 0;
let autoScrollFrame = null;

function atualizarAutoScroll(clientY){
  if(clientY < AUTOSCROLL_BORDA){
    autoScrollDirecao = -1;
    autoScrollVelocidade = AUTOSCROLL_VELOCIDADE_MAX * (1 - clientY / AUTOSCROLL_BORDA);
  } else if(clientY > window.innerHeight - AUTOSCROLL_BORDA){
    autoScrollDirecao = 1;
    autoScrollVelocidade = AUTOSCROLL_VELOCIDADE_MAX * (1 - (window.innerHeight - clientY) / AUTOSCROLL_BORDA);
  } else {
    autoScrollDirecao = 0;
  }
  if(autoScrollDirecao !== 0 && autoScrollFrame === null){
    autoScrollFrame = requestAnimationFrame(passoAutoScroll);
  }
}

function passoAutoScroll(){
  if(!dragState || autoScrollDirecao === 0){
    autoScrollFrame = null;
    return;
  }
  window.scrollBy(0, Math.max(4, autoScrollVelocidade) * autoScrollDirecao);
  if(dragState.lastClientX !== undefined){
    atualizarAlvoDrag(dragState.lastClientX, dragState.lastClientY);
  }
  autoScrollFrame = requestAnimationFrame(passoAutoScroll);
}

function pararAutoScroll(){
  autoScrollDirecao = 0;
  autoScrollVelocidade = 0;
  if(autoScrollFrame !== null){ cancelAnimationFrame(autoScrollFrame); autoScrollFrame = null; }
}

function initDragDrop(d){
  document.querySelectorAll('[id^="dnd-"]').forEach(container=>{
    const banco = container.querySelector('.dnd-bank');
    if(banco && !container.querySelector('.dnd-hint')){
      const dica = document.createElement('p');
      dica.className = 'dnd-hint';
      dica.textContent = TEXTOS.dicaArrastar;
      banco.insertAdjacentElement('beforebegin', dica);
    }
    restaurarEstadoDnd(container, d.respostas[container.id]);
    container.querySelectorAll('.dnd-piece').forEach(piece=>{
      piece.addEventListener('pointerdown', iniciarArrasteDnd);
    });
  });
}

function restaurarEstadoDnd(container, valorSalvo){
  let estado = {};
  if(valorSalvo){ try{ estado = JSON.parse(valorSalvo) || {}; }catch(e){ estado = {}; } }
  if(container.querySelector('.dnd-column')){
    Object.keys(estado).forEach(pieceId=>{
      const piece = container.querySelector('[data-piece-id="' + pieceId + '"]');
      const coluna = container.querySelector('[data-column-id="' + estado[pieceId] + '"]');
      if(piece && coluna){ coluna.appendChild(piece); }
    });
  } else {
    Object.keys(estado).forEach(targetId=>{
      const target = container.querySelector('[data-target-id="' + targetId + '"]');
      const piece = container.querySelector('[data-piece-id="' + estado[targetId] + '"]');
      if(target && piece){ target.appendChild(piece); target.classList.add('filled'); }
    });
  }
}

function iniciarArrasteDnd(e){
  const piece = e.currentTarget;
  const container = piece.closest('[id^="dnd-"]');
  if(!container) return;
  const rect = piece.getBoundingClientRect();
  const originParent = piece.parentElement;
  // placeholder reserva o espaço da peça no lugar de origem, pra layout (banco/alvo) não
  // encolher e deslocar os alvos embaixo do dedo/cursor enquanto a peça está sendo arrastada
  const placeholder = document.createElement('span');
  placeholder.className = 'dnd-piece-placeholder';
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  originParent.insertBefore(placeholder, piece);
  dragState = {
    piece, container, originParent, placeholder,
    startX: e.clientX, startY: e.clientY,
    offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
    width: rect.width, height: rect.height,
    moved: false, alvoAtual: null
  };
  piece.classList.add('dragging');
  piece.style.pointerEvents = 'none';
  piece.style.position = 'fixed';
  piece.style.width = rect.width + 'px';
  piece.style.left = rect.left + 'px';
  piece.style.top = rect.top + 'px';
  document.body.appendChild(piece);
  document.addEventListener('pointermove', moverArrasteDnd);
  document.addEventListener('pointerup', soltarArrasteDnd);
  document.addEventListener('pointercancel', soltarArrasteDnd);
}

function atualizarAlvoDrag(clientX, clientY){
  const abaixo = document.elementFromPoint(clientX, clientY);
  const alvo = abaixo ? abaixo.closest('.dnd-target, .dnd-column') : null;
  const alvoValido = alvo && alvo.closest('[id^="dnd-"]') === dragState.container ? alvo : null;
  if(dragState.alvoAtual !== alvoValido){
    if(dragState.alvoAtual) dragState.alvoAtual.classList.remove('drag-over');
    if(alvoValido) alvoValido.classList.add('drag-over');
    dragState.alvoAtual = alvoValido;
  }
}

function moverArrasteDnd(e){
  if(!dragState) return;
  const { piece } = dragState;
  const x = e.clientX - dragState.offsetX;
  const y = e.clientY - dragState.offsetY;
  piece.style.left = x + 'px';
  piece.style.top = y + 'px';
  if(Math.abs(e.clientX - dragState.startX) > 7 || Math.abs(e.clientY - dragState.startY) > 7){
    dragState.moved = true;
  }
  dragState.lastClientX = e.clientX;
  dragState.lastClientY = e.clientY;
  atualizarAlvoDrag(e.clientX, e.clientY);
  atualizarAutoScroll(e.clientY);
}

function soltarArrasteDnd(e){
  if(!dragState) return;
  const { piece, container, originParent, placeholder, moved } = dragState;
  pararAutoScroll();
  document.removeEventListener('pointermove', moverArrasteDnd);
  document.removeEventListener('pointerup', soltarArrasteDnd);
  document.removeEventListener('pointercancel', soltarArrasteDnd);
  piece.classList.remove('dragging');
  piece.style.position = '';
  piece.style.pointerEvents = '';
  piece.style.left = '';
  piece.style.top = '';
  piece.style.width = '';
  if(dragState.alvoAtual) dragState.alvoAtual.classList.remove('drag-over');

  const banco = container.querySelector('.dnd-bank');
  const abaixo = document.elementFromPoint(e.clientX, e.clientY);
  const alvoSolto = abaixo ? abaixo.closest('.dnd-target, .dnd-column') : null;
  const alvoValido = alvoSolto && alvoSolto.closest('[id^="dnd-"]') === container ? alvoSolto : null;

  if(!moved){
    // tap curto: peça em alvo/coluna volta pro banco; peça já no banco volta exatamente onde estava
    if(originParent && (originParent.classList.contains('dnd-target') || originParent.classList.contains('dnd-column'))){
      banco.appendChild(piece);
    } else {
      originParent.insertBefore(piece, placeholder);
    }
  } else if(alvoValido && alvoValido.classList.contains('dnd-column')){
    // sorting: coluna aceita várias peças, não expulsa quem já tá lá
    alvoValido.appendChild(piece);
    pulsarEncaixe(piece);
  } else if(alvoValido){
    const ocupante = alvoValido.querySelector('.dnd-piece');
    if(ocupante && ocupante !== piece){ banco.appendChild(ocupante); }
    alvoValido.appendChild(piece);
    pulsarEncaixe(piece);
  } else {
    banco.appendChild(piece);
  }
  if(placeholder.parentElement) placeholder.remove();

  container.querySelectorAll('.dnd-target').forEach(t=>{
    t.classList.toggle('filled', !!t.querySelector('.dnd-piece'));
  });

  dragState = null;
  limparGabarito(container);
  salvarEstadoDnd(container);
}

// Pequena pulsação de confirmação quando uma peça encaixa num alvo/coluna válido.
function pulsarEncaixe(piece){
  piece.classList.remove('encaixou');
  void piece.offsetWidth; // força reflow, pra animação poder rodar de novo em encaixes seguidos
  piece.classList.add('encaixou');
  piece.addEventListener('animationend', () => piece.classList.remove('encaixou'), { once:true });
}

function salvarEstadoDnd(container){
  const estado = {};
  if(container.querySelector('.dnd-column')){
    container.querySelectorAll('.dnd-piece').forEach(piece=>{
      const coluna = piece.closest('.dnd-column');
      if(coluna){ estado[piece.dataset.pieceId] = coluna.dataset.columnId; }
    });
  } else {
    container.querySelectorAll('.dnd-target').forEach(target=>{
      const piece = target.querySelector('.dnd-piece');
      if(piece){ estado[target.dataset.targetId] = piece.dataset.pieceId; }
    });
  }
  agendarSalvar(container.id, JSON.stringify(estado));
}

/* ---- Exercício: quiz (clique/seleção única, sem drag) ---- */

function initQuiz(d){
  document.querySelectorAll('[id^="quiz-"]').forEach(container=>{
    const salvo = d.respostas[container.id];
    if(salvo){
      const opt = container.querySelector('.quiz-option[data-valor="' + salvo + '"]');
      if(opt) opt.classList.add('selected');
    }
    container.querySelectorAll('.quiz-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        container.querySelectorAll('.quiz-option').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        limparGabarito(container);
        agendarSalvar(container.id, opt.dataset.valor);
      });
    });
  });
}

/* ---- Gabarito automático: botão "Check answers" nos exercícios dnd/quiz que vierem marcados
   com data-correta (alvo único e quiz) ou data-coluna-certa (peça de sorting). Exercícios
   antigos, sem essa marcação, simplesmente não ganham o botão — não tem gabarito pra conferir.
   Não bloqueia o aluno: ele pode arrastar/escolher de novo a qualquer momento (isso já limpa
   a marcação certo/errado anterior, ver limparGabarito() chamado no clique e no soltar). ---- */

function exercicioTemGabarito(container){
  if(container.classList.contains('quiz-exercise')){
    return !!container.querySelector('.quiz-option[data-correta="true"]');
  }
  if(container.querySelector('.dnd-column')){
    return !!container.querySelector('.dnd-piece[data-coluna-certa]');
  }
  return !!container.querySelector('.dnd-target[data-correta]');
}

function initGabarito(){
  document.querySelectorAll('.dnd-exercise, .quiz-exercise').forEach(container=>{
    if(!exercicioTemGabarito(container)) return;
    if(container.nextElementSibling && container.nextElementSibling.classList.contains('gabarito-btn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gabarito-btn';
    btn.textContent = TEXTOS.gabaritoBotao;
    btn.addEventListener('click', ()=>{
      conferirRespostas(container);
      if(INFANTIL){ try{ celebrarResultado(container, btn); }catch(e){} }
    });
    container.insertAdjacentElement('afterend', btn);
  });
}

function conferirRespostas(container){
  limparGabarito(container);
  if(container.classList.contains('quiz-exercise')) return conferirQuiz(container);
  if(container.querySelector('.dnd-column')) return conferirDndColunas(container);
  return conferirDndAlvos(container);
}

function limparGabarito(container){
  container.querySelectorAll('.gabarito-certo, .gabarito-errado').forEach(el=>{
    el.classList.remove('gabarito-certo', 'gabarito-errado');
  });
  container.querySelectorAll('.gabarito-wrap').forEach(el=> el.remove());
}

// Pequeno link "see correct answer" — inserido logo depois do elemento errado (alvo, peça ou
// opção de quiz), sem mexer na resposta que o aluno já deu.
function inserirLinkGabarito(depoisDe, textoCorreto){
  const wrap = document.createElement('span');
  wrap.className = 'gabarito-wrap';
  const link = document.createElement('button');
  link.type = 'button';
  link.className = 'gabarito-link';
  link.textContent = TEXTOS.gabaritoLinkVer;
  const revelado = document.createElement('span');
  revelado.className = 'gabarito-revelado';
  revelado.textContent = textoCorreto;
  revelado.style.display = 'none';
  link.addEventListener('click', ()=>{
    const aberto = revelado.style.display !== 'none';
    revelado.style.display = aberto ? 'none' : 'block';
    link.textContent = aberto ? TEXTOS.gabaritoLinkVer : TEXTOS.gabaritoLinkEsconder;
  });
  wrap.appendChild(link);
  wrap.appendChild(revelado);
  depoisDe.insertAdjacentElement('afterend', wrap);
}

function conferirDndAlvos(container){
  container.querySelectorAll('.dnd-target[data-correta]').forEach(target=>{
    const pecaCerta = target.dataset.correta;
    const pecaAtual = target.querySelector('.dnd-piece');
    if(pecaAtual && pecaAtual.dataset.pieceId === pecaCerta){
      target.classList.add('gabarito-certo');
    } else {
      target.classList.add('gabarito-errado');
      const peca = container.querySelector('.dnd-piece[data-piece-id="' + pecaCerta + '"]');
      inserirLinkGabarito(target, peca ? peca.textContent : pecaCerta);
    }
  });
}

function conferirDndColunas(container){
  container.querySelectorAll('.dnd-piece[data-coluna-certa]').forEach(peca=>{
    const colunaCerta = peca.dataset.colunaCerta;
    const colunaAtual = peca.closest('.dnd-column');
    if(colunaAtual && colunaAtual.dataset.columnId === colunaCerta){
      peca.classList.add('gabarito-certo');
    } else {
      peca.classList.add('gabarito-errado');
      const coluna = container.querySelector('.dnd-column[data-column-id="' + colunaCerta + '"] .dnd-column-label');
      inserirLinkGabarito(peca, coluna ? coluna.textContent : colunaCerta);
    }
  });
}

function conferirQuiz(container){
  const opcaoCerta = container.querySelector('.quiz-option[data-correta="true"]');
  if(!opcaoCerta) return;
  const selecionada = container.querySelector('.quiz-option.selected');
  if(selecionada === opcaoCerta){
    selecionada.classList.add('gabarito-certo');
    return;
  }
  if(selecionada){
    selecionada.classList.add('gabarito-errado');
    inserirLinkGabarito(selecionada, opcaoCerta.textContent);
  } else {
    inserirLinkGabarito(container.lastElementChild, opcaoCerta.textContent);
  }
}

/* ---- Tema infantil: celebração depois do "Check answers". Só LÊ o resultado que o gabarito acabou de
   marcar (.gabarito-certo / .gabarito-errado) — não muda a lógica do gabarito nem as respostas salvas.
   Sem som e sem biblioteca: são só <span> animados por CSS, numa camada que não recebe cliques. ---- */
const celebracaoUltima = new WeakMap();   // container -> assinatura da última conferência
const celebracaoMensagem = new WeakMap(); // container -> { el, timer } da mensagem na tela
let celebracaoFraseAnterior = -1;

// "Foto" das respostas do exercício: onde está cada peça / qual opção está marcada.
function assinaturaRespostas(container){
  const partes = [];
  container.querySelectorAll('.dnd-piece').forEach(p=>{
    const pai = p.parentElement;
    partes.push((p.dataset.pieceId || '') + '>' + ((pai && (pai.dataset.targetId || pai.dataset.columnId)) || 'banco'));
  });
  const sel = container.querySelector('.quiz-option.selected');
  if(sel) partes.push('q:' + (sel.dataset.valor || ''));
  return partes.join('|');
}

function celebrarResultado(container, btn){
  const certos = container.querySelectorAll('.gabarito-certo').length;
  const errados = container.querySelectorAll('.gabarito-errado').length;
  const tudoCerto = errados === 0 && certos > 0;
  const assinatura = assinaturaRespostas(container) + '#' + certos + '/' + errados;
  const repetido = celebracaoUltima.get(container) === assinatura;
  celebracaoUltima.set(container, assinatura);
  // Cliques seguidos sem mudar nenhuma resposta: não repete a celebração.
  if(repetido && tudoCerto) return;

  // Mensagem curta embaixo do botão (aparece mesmo com movimento reduzido)
  const anterior = celebracaoMensagem.get(container);
  if(anterior){ clearTimeout(anterior.timer); anterior.el.remove(); }
  const lista = tudoCerto ? TEXTOS.celebraAcerto : TEXTOS.celebraQuase;
  let i = Math.floor(Math.random() * lista.length);
  if(tudoCerto){ if(i === celebracaoFraseAnterior) i = (i + 1) % lista.length; celebracaoFraseAnterior = i; }
  const el = document.createElement('div');
  el.className = 'celebra-msg ' + (tudoCerto ? 'celebra-acerto' : 'celebra-quase');
  el.setAttribute('role', 'status');
  el.textContent = lista[i];
  btn.insertAdjacentElement('afterend', el);
  const timer = setTimeout(()=>{ el.remove(); }, 4500);
  celebracaoMensagem.set(container, { el, timer });

  // Estrelas/confete (não roda se o aluno pediu menos movimento; conferência repetida também não)
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(repetido) return;
  if(tudoCerto) soltarConfete(btn, 30, 210, 150);
  else if(certos > 0) soltarConfete(btn, 6, 70, 60);
}

function soltarConfete(origem, quantidade, alcanceX, alcanceY){
  const r = origem.getBoundingClientRect();
  const camada = document.createElement('div');
  camada.className = 'celebra-camada';
  camada.setAttribute('aria-hidden', 'true');
  camada.style.left = (r.right + 20) + 'px'; // sai do lado direito do botão (área vazia), pra não cobrir o exercício
  camada.style.top = (r.top + r.height / 2) + 'px';
  const cores = ['var(--amber-bold)', 'var(--manteiga)', 'var(--charcoal)'];
  for(let n = 0; n < quantidade; n++){
    const p = document.createElement('span');
    const estrela = n % 2 === 0;
    p.className = 'celebra-peca ' + (estrela ? 'celebra-estrela' : 'celebra-tira');
    const tam = (estrela ? 12 : 8) + Math.random() * (quantidade > 10 ? 9 : 3);
    p.style.setProperty('--tam', tam.toFixed(1) + 'px');
    p.style.setProperty('--cor', cores[n % cores.length]);
    p.style.setProperty('--dx', ((Math.random() * 1.1 - 0.1) * alcanceX).toFixed(0) + 'px');
    p.style.setProperty('--dy', (-(0.35 + Math.random() * 0.65) * alcanceY).toFixed(0) + 'px');
    p.style.setProperty('--rot', ((Math.random() * 2 - 1) * 400).toFixed(0) + 'deg');
    p.style.setProperty('--dur', (1000 + Math.random() * 350).toFixed(0) + 'ms');
    p.style.setProperty('--atraso', (Math.random() * 120).toFixed(0) + 'ms');
    camada.appendChild(p);
  }
  document.body.appendChild(camada);
  setTimeout(()=>{ camada.remove(); }, 1700);
}

/* ---- Baralho de flashcards: cards consecutivos (sem nenhum outro tipo de bloco no meio)
   viram um baralho navegável (Prev/Next, ou ↻ pra recomeçar no último). Card avulso não ganha
   navegação, só a pergunta abaixo. A pergunta de reflexão é sempre a mesma, sempre aparece,
   salva como qualquer caixa de texto (ta-...), na mesma "capa" visual do baralho. ---- */

function initFlashcards(d){
  const container = document.getElementById('conteudo-sessao');
  if(!container) return;
  const filhos = Array.from(container.children);
  const ehFlashcard = el => el.matches && el.matches('section.block, .card') && el.querySelector('.flashcard');
  let i = 0;
  while(i < filhos.length){
    if(ehFlashcard(filhos[i])){
      let j = i;
      while(j < filhos.length && ehFlashcard(filhos[j])) j++;
      montarBaralho(filhos.slice(i, j), container, d);
      i = j;
    } else {
      i++;
    }
  }
}

function montarBaralho(elementos, containerPai, d){
  const total = elementos.length;
  const primeiraCosta = elementos[0].querySelector('.reveal-content.flashcard-back');
  const idBase = primeiraCosta ? primeiraCosta.id : ('deck-' + Math.random().toString(36).slice(2));

  const grupo = document.createElement('div');
  grupo.className = 'flashcard-group';
  containerPai.insertBefore(grupo, elementos[0]);

  if(total > 1){
    const deck = document.createElement('div');
    deck.className = 'flashcard-deck';
    grupo.appendChild(deck);

    const stage = document.createElement('div');
    stage.className = 'deck-stage';

    const btnPrev = document.createElement('button');
    btnPrev.className = 'deck-nav-btn deck-prev';
    btnPrev.type = 'button';
    btnPrev.setAttribute('aria-label', TEXTOS.deckCardAnterior);
    btnPrev.textContent = '←';

    const btnNext = document.createElement('button');
    btnNext.className = 'deck-nav-btn deck-next';
    btnNext.type = 'button';

    const counter = document.createElement('div');
    counter.className = 'deck-counter';

    stage.appendChild(btnPrev);
    elementos.forEach(el => stage.appendChild(el));
    stage.appendChild(btnNext);
    deck.appendChild(stage);
    deck.appendChild(counter);

    let idx = 0;
    function fecharCard(el){
      const costa = el.querySelector('.reveal-content.flashcard-back');
      if(costa) costa.classList.remove('open');
    }
    function atualizar(){
      elementos.forEach((el, n) => el.classList.toggle('deck-hidden', n !== idx));
      counter.textContent = (idx + 1) + ' / ' + total;
      btnPrev.disabled = idx === 0;
      if(idx === total - 1){
        btnNext.classList.add('restart');
        btnNext.textContent = '↻';
        btnNext.setAttribute('aria-label', TEXTOS.deckRecomecar);
      } else {
        btnNext.classList.remove('restart');
        btnNext.textContent = '→';
        btnNext.setAttribute('aria-label', TEXTOS.deckCardSeguinte);
      }
    }
    btnPrev.addEventListener('click', () => {
      if(idx === 0) return;
      fecharCard(elementos[idx]);
      idx--;
      atualizar();
    });
    btnNext.addEventListener('click', () => {
      fecharCard(elementos[idx]);
      idx = (idx === total - 1) ? 0 : idx + 1;
      atualizar();
    });
    atualizar();
  } else {
    grupo.appendChild(elementos[0]);
  }

  const reflexao = document.createElement('section');
  reflexao.className = 'block flash-reflect';
  const taId = 'ta-reflect-' + idBase;
  reflexao.innerHTML = `<p class="qtext">${TEXTOS.flashReflectPergunta}</p>
    <textarea id="${taId}" placeholder="${TEXTOS.respostaPlaceholder}"></textarea>`;
  grupo.appendChild(reflexao);

  const ta = reflexao.querySelector('textarea');
  if(d.respostas[taId] !== undefined){ ta.value = d.respostas[taId]; }
  ta.addEventListener('input', ()=>agendarSalvar(taId, ta.value));
}

/* ---- Pergunta de fechamento: sempre a última coisa da sessão, id fixo (não depende de
   nada que o professor escreveu), logo antes do botão de concluir a sessão. ---- */

function adicionarPerguntaFechamento(d){
  const container = document.getElementById('conteudo-sessao');
  if(!container) return;
  const bloco = document.createElement('section');
  bloco.className = 'block session-closing';
  const taId = 'ta-session-reflect';
  bloco.innerHTML = `
    <div class="kicker">${TEXTOS.fechamentoKicker}</div>
    <p class="qtext">${TEXTOS.fechamentoPergunta}</p>
    <textarea id="${taId}" placeholder="${TEXTOS.respostaPlaceholder}"></textarea>
  `;
  container.appendChild(bloco);

  const ta = bloco.querySelector('textarea');
  if(d.respostas[taId] !== undefined){ ta.value = d.respostas[taId]; }
  ta.addEventListener('input', ()=>agendarSalvar(taId, ta.value));
}

iniciar();
</script>
